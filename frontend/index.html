<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>POVOD</title>
    <meta
      name="description"
      content="Собирайте друзей на встречи без долгих переписок: создайте повод, пригласите одним кликом и следите, кто идёт."
    />

    <!--
      Цвет системной панели браузера. Значение одно и без media-условия:
      ThemeContext держит его в соответствии с активной темой, а тема может быть
      выбрана вручную — media-запрос про такой выбор ничего не знает.
    -->
    <meta name="theme-color" content="#ebf2fa" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- iOS манифест не читает: установку с домашнего экрана настраивают мета-теги. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="POVOD" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
