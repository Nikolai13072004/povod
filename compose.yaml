name: povod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-povod}
      POSTGRES_USER: ${POSTGRES_USER:-povod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-povod_local_password}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-povod}:${POSTGRES_PASSWORD:-povod_local_password}@postgres:5432/${POSTGRES_DB:-povod}
      DATABASE_SSL: "false"
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
      ENABLE_EXTERNAL_EVENTS: ${ENABLE_EXTERNAL_EVENTS:-false}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
      DEMO_AUTH_PASSWORD: ${DEMO_AUTH_PASSWORD:-povod-demo}
      VK_APP_ID: ${VK_APP_ID:-}
      VK_APP_SECRET: ${VK_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/}
        VITE_DEMO_AUTH_ENABLED: ${VITE_DEMO_AUTH_ENABLED:-true}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:8080"

volumes:
  postgres_data:
